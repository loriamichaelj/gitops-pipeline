name: platform apply

# Argo CD applies infrastructure on its own once a change reaches dev, and
# Crossplane creates the cloud resources. This workflow is the CI side of that: it
# renders what dev now describes and waits until the cloud matches, so a merge is
# only "applied" when the hub actually converged. It changes nothing itself.
#
# Runs in the `dev` environment (dev branch only) with the dev identity.
# Manual for now: the hub is a local cluster that is not always on, so a push
# trigger would fail whenever it is off.

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: How long to wait for the cloud to match
        type: string
        default: "600"

permissions:
  contents: read

concurrency:
  group: platform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      CROSSPLANE_CLI_VERSION: v2.5.0 # no release binaries; built from the tagged module
      INFRA_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install tools
        run: |
          .github/scripts/install-tools.sh yq
          go install "github.com/crossplane/cli/v2/cmd/crossplane@${CROSSPLANE_CLI_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Wait for the cloud to match
        run: scripts/infra.sh verify "$TIMEOUT_SECONDS" | tee -a "$GITHUB_STEP_SUMMARY"
