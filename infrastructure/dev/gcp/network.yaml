# A custom-mode VPC with one subnet (free). Deleting this XR deletes both.
apiVersion: platform.gitops-pipeline.io/v1alpha1
kind: XNetwork
metadata:
  name: main
  namespace: infra-dev
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        cloud: gcp
  parameters:
    region: us-central1
    cidr: 10.10.0.0/20
    deletionPolicy: Delete
