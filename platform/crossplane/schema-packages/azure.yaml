# Azure provider packages, installed only so scripts/validate-schemas.sh can check the
# Azure Compositions against the real CRDs. No hub installs them: an Azure provider goes
# on a hub only once its identity exists (see platform/apis/README.md).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-family-azure
spec:
  package: xpkg.upbound.io/upbound/provider-family-azure:v2.8.4
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-azure-storage
spec:
  package: xpkg.upbound.io/upbound/provider-azure-storage:v2.8.4
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-azure-network
spec:
  package: xpkg.upbound.io/upbound/provider-azure-network:v2.8.4
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-azure-resources
spec:
  package: xpkg.upbound.io/upbound/provider-azure-resources:v2.8.4
