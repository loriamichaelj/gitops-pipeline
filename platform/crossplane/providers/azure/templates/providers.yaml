{{- /*
The family provider owns the ProviderConfig CRDs. Declaring it explicitly pins its
version; Crossplane would otherwise install it as an unpinned dependency.
*/ -}}
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-family-azure
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: {{ .Values.registry }}/provider-family-azure:{{ .Values.version }}
{{- range $family := .Values.families }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-azure-{{ $family }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: {{ $.Values.registry }}/provider-azure-{{ $family }}:{{ $.Values.version }}
  runtimeConfigRef:
    name: provider-azure-{{ $family }}
{{- end }}
