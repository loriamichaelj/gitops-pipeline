{{- /*
The family provider owns the ProviderConfig CRDs. Declaring it explicitly pins its
version; Crossplane would otherwise install it as an unpinned dependency.
*/ -}}
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-family-gcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: {{ .Values.registry }}/provider-family-gcp:{{ .Values.version }}
{{- range $family, $cfg := .Values.families }}
{{- /* A family with no identity yet is skipped, so a hub can sync a new family before bootstrap provisions its service account. */ -}}
{{- if $cfg.serviceAccount }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-gcp-{{ $family }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: {{ $.Values.registry }}/provider-gcp-{{ $family }}:{{ $.Values.version }}
  runtimeConfigRef:
    name: provider-gcp-{{ $family }}
{{- end }}
{{- end }}
