apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnetworks-gcp
  labels:
    cloud: gcp
spec:
  compositeTypeRef:
    apiVersion: platform.gitops-pipeline.io/v1alpha1
    kind: XNetwork
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-kcl
      requirements:
        requiredResources:
          # Hub facts (project ID), rendered from the hub's Argo CD cluster Secret.
          - requirementName: environment
            apiVersion: apiextensions.crossplane.io/v1beta1
            kind: EnvironmentConfig
            name: gcp
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            import crypto

            _p = option("params")
            _xr = _p.oxr
            _params = _xr.spec?.parameters or {}

            _envs = _p?.requiredResources?.environment or []
            _projectID = _envs[0]?.Resource?.data?.projectID if _envs else ""
            assert _projectID, "EnvironmentConfig 'gcp' with data.projectID not found: this hub has no GCP identity"

            _ns = _xr.metadata.namespace
            _name = _xr.metadata.name

            # Deterministic: the same XR in the same project always maps to the same
            # network, so a rebuilt hub adopts it instead of creating one. The network
            # and its subnet share the name; they are different resource types.
            _hash = crypto.sha256("${_projectID}/${_ns}/${_name}")[:8]
            _readable = "${_ns}-${_name}".replace(".", "-")
            _netName = _readable[:54].rstrip("-") + "-" + _hash

            _region = _params?.region or "us-central1"
            _orphan = (_params?.deletionPolicy or "Delete") == "Orphan"
            # Orphan: everything except Delete.
            _policies = ["Observe", "Create", "Update", "LateInitialize"] if _orphan else ["*"]

            # Pod and service ranges for clusters; present only when both are asked for.
            _secondary = {
                secondaryIpRange = [
                    {rangeName = "pods", ipCidrRange = _params.podsCidr}
                    {rangeName = "services", ipCidrRange = _params.servicesCidr}
                ]
            } if _params?.podsCidr else {}

            _network = {
                apiVersion = "compute.gcp.m.upbound.io/v1beta1"
                kind = "Network"
                metadata.annotations = {
                    "krm.kcl.dev/composition-resource-name" = "network"
                    "crossplane.io/external-name" = _netName
                }
                spec = {
                    managementPolicies = _policies
                    providerConfigRef = {kind = "ClusterProviderConfig", name = "default"}
                    forProvider = {
                        # Custom mode: no subnets in other regions, nothing created implicitly.
                        autoCreateSubnetworks = False
                        routingMode = "REGIONAL"
                        description = "${_ns}/${_name}, managed by Crossplane"
                    }
                }
            }

            _subnet = {
                apiVersion = "compute.gcp.m.upbound.io/v1beta1"
                kind = "Subnetwork"
                metadata.annotations = {
                    "krm.kcl.dev/composition-resource-name" = "subnet"
                    "crossplane.io/external-name" = _netName
                }
                spec = {
                    managementPolicies = _policies
                    providerConfigRef = {kind = "ClusterProviderConfig", name = "default"}
                    forProvider = {
                        region = _region
                        ipCidrRange = _params?.cidr or "10.0.0.0/20"
                        privateIpGoogleAccess = True
                        networkSelector.matchControllerRef = True
                        description = "${_ns}/${_name}, managed by Crossplane"
                        **_secondary
                    }
                }
            }

            _dxr = {
                **_p.dxr
                status.networkName = _netName
                status.subnetName = _netName
            }

            items = [_network, _subnet, _dxr]
    - step: ready
      functionRef:
        name: function-auto-ready
