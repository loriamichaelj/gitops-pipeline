{{- /*
Wave -10: one namespace per environment for its infrastructure XRs. Never
pruned: deleting the namespace would delete every XR and cloud resource in it.
*/ -}}
{{- range .Values.environments }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
